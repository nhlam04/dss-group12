{% extends "base.html" %}

{% block title %}Allocation History - Charity Fund DSS{% endblock %}

{% block content %}
<h1 class="mb-4"><i class="bi bi-clock-history"></i> Allocation History</h1>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Strategy</th>
                        <th>Budget</th>
                        <th>Allocated</th>
                        <th>Utilization</th>
                        <th>Fully Funded</th>
                        <th>Partial</th>
                        <th>Rejected</th>
                        <th>People</th>
                    </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
